name: Build Windows EXE

# Laeuft automatisch bei jedem Push auf main/master und kann zusaetzlich
# manuell ueber den "Actions"-Tab in GitHub gestartet werden.
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: EXE mit PyInstaller bauen
        run: |
          python -m PyInstaller --noconfirm --windowed --onefile --name CineVault --icon=assets/cinevault.ico --add-data "assets;assets" main.py

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-windows-exe
          path: dist/CineVault.exe
          retention-days: 30
